<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Object-fit and Position</title>
    <style>
        .container{
            width: 500px;
            height: 500px;
            background-color: antiquewhite;
            border: 2px solid black;
        }
        .box{
            width: 300px;
            height: 250px;
            border: 2px solid red;
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQsyb12bpcU2OBnGGnWETSexhZSif3gExhmnn0YMyvezg&s=10");
            /* object-fit: cover; */
            object-fit: contain;
            /* object-fit: fill; */
            object-position: center center;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
