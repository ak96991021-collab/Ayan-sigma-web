<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex - 8 Unsolved</title>
    <style>
        .container {
            width: 800px;
            height: 500px;
            background-color: red;
            display: flex;
            align-items: flex-end;
        }

        .box {
            width: 80px;
            height: 80px;
            background-color: blue;
            border-radius: 70px;
            animation: bounce 3s linear 1s alternate infinite;
        }

        @keyframes bounce {
            0%{}
            25%{
                transform: translate(150px, -400px);
            }
            50%{
                 transform: translate(300px);
            }
            75%{
                 transform: translate(450px, -400px);
            }
            100%{
                 transform: translate(600px);
            }
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>

</html>
