<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex - 5 solved</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        header {
            position: sticky;
            top: 0px;
        }

        nav {
            background-color: coral;
            height: 60px;
        }

        main {
            height: 800px;
            background-color: black;
            color: white;
            padding: 80px 30px;
            
        }

        .container {
           height: 500px;
           background-color: green;
           margin: 20px;
            padding: 100px 50px;
        }
        .box1{
          background-color: pink;
          height: 500px;
          width: 45%;
          float: right;
        }
        .box2{
          background-color: purple;
          height: 500px;
          width: 45%;
        }

        .text{
            border: 2px solid white;
            height: 60px;
            width: 350px;
            border-radius: 20px;
            margin: 20px 30vw;
            text-align: center;
            padding: 20px 0px 0px 0px;
        }
        .logo{
            height: 40px;
            width: 40px;
            background-color: orange;
            position: fixed;
            bottom: 20px;
            right: 20px;
            border-radius: 60px;
        }

        footer{
            height: 80px;
            background-color: darkturquoise;
        }
    </style>
</head>

<body>
    <header>
        <nav></nav>
    </header>

    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>

        <div class="text">
            <p>Welcome To Sigma Web Development Express</p>
        </div>

        <div class="logo"></div>
    </main>

    <footer></footer>
</body>

</html>
