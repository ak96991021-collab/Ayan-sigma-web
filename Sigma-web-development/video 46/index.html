<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <style>
        .container {
            width: 80vw;
            height: 80vh;
            border: 4px solid black;
        }

        .box {
            width: 70px;
            height: 70px;
            background-color: hotpink;
            border: 2px solid black;
            border-radius: 50px;
            animation: ball 3s ease-in-out 1s infinite alternate;
        }

        @keyframes ball {
            0% {}

            30% {
                transform: translate(180px, 430px);
            }

            50% {
                transform: translate(360px, 0px);
            }
            70% {
                transform: translate(600px, 430px);
            }
            100% {
                transform: translate(800px,  0px);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>

</html>
