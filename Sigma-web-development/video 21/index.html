<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Specificity</title>
    <style>
        /* This specificity of this selector 1 */
        h1{
            color: aqua;
            } 
 
        /* This specificity of this selector 10 */
        .purple {
            color: purple;
        }
        
        /* This specificity of this selector 1 + 10 = 11 */
        h1.yellow {
            color: yellow;
        }
        
        /* This is an example of attribute selector This specificity of this selector 1 */ 
   [data-x=a]{
        color: maroon;
        }
        
        /* This specificity of this selector 10 */
        .red {
            color: red;
        }
        
        /* This specificity of this selector 1 + 10 + 10 + 10 + 10 = 41 */
        a.harryclass.rohan-class[href]:hover{
            color: blueviolet;
        }
       
    </style>
</head>

<body>
    <div>
        <h1 class="yellow red purple" id="brown" data-x="a">CSS Specificity</h1>
    </div>
    
</body>

</html>
