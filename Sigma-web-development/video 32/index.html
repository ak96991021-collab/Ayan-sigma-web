<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex - 3 solved</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: grey;
        }
        .card{
            margin: 20px;
            background-color: white;
            width: 300px;
            height: 450px;
            border-radius: 10px;
        }

        .card-img img{
            width: 280px;
            padding: 10px;
            border-radius: 17px;
        }

        .cap{
            margin: 0px 15px;
        }
        .cap span{
            border: 2px solid gray;
            border-radius: 12px;
            padding: 2px 6px;
        }

        .con{
            margin: 15px ;
        }
        .con p{
            font-size: 14px;
            margin-top: 10px;
            width: 260px;
            color: gray;
        }

        .btn{
            text-align: center;
        }
        .btn button{
            border: none;
            background-color: aqua;
            padding: 10px;
            color: blue;
            border-radius: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn button:hover{
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <div class="card">
     <div class="card-img"><img src="images.jpg" alt="card-img" > </div>

     <div class="cap">
        <span>Nature</span>
        <span>Lake</span>
     </div>

     <div class="con">
        <h2>Harry</h2>
        <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ratione vero magnam, voluptatum natus quidem officiis fugiat eligendi placeat blanditiis architecto, dolorum voluptates alias.</p>
     </div>

     <div class="btn"><button>Read more</button></div>

    </div>
</body>
</html>
