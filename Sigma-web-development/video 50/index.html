<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        .one {
            filter: saturate(120%) brightness(140%) blur(1px);
        }

        .two {
            filter: grayscale(100%) opacity(0.5);
        }
    </style>
</head>

<body>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTqhLrbHtsGpppwZXif-ht9YYqlr3YgL3ajmq-9O0SX2g&s=10"
        class="one" height="250">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRceuLCGehTJLleAxQAURbFhZN7UeKwxsBAiR8VWk9ISQ&s=10"
        class="two" height="250">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSc_VOshxWyJ8TKH-dfxyKP0xBuOJHEp-wvuuMwsvguCQ&s=10"
        class="three" height="250">
</body>

</html>
