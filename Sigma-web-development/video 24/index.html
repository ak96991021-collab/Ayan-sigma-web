<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px green;
         }

         .text-shadow{
            text-shadow: 2px 2px 4px #edaeda;
            border: 2px solid green;
            outline: 2px solid red;
            outline-offset: 33px;
            border-radius: 30px;
         }
    </style>
</head>
<body>
    <div class="box">
        I am a box.
    </div>

    <p class="text-shadow">
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Quas distinctio fugit quos. Architecto aspernatur incidunt, at, nam cumque dolor, veniam rerum pariatur corrupti neque placeat eveniet sit deleniti velit optio?
    </p>


</body>
</html>
