<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .parent{
            border: 2px solid blue;
              margin: 20px;
            padding: 20px;
            position: relative;
        }
        .box{
            margin: 10px;
            border: 2px solid black;
        }
        .box1{
            background-color: red;
            height: 200px;
            width: 900px;
             position: absolute;
            top: 0px;
            left: 0px;
            /* z-index: -1; */
        
        }
        .box2{
            background-color: aqua;
            height: 200px;
            width: 900px;
            /* position: sticky;
            top: 0px; */
        }
        .box3{
            background-color: blue;
            height: 200px;
            width: 900px;
        }
        .box4{
            background-color: yellow;
            height: 200px;
            width: 900px;
        }

    </style>
</head>
<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>
</html>
