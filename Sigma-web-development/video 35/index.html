<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors more</title>
    <style>
        .boxes::before{
            content: "MY name is Ayan.";
            color: blue;
            font-weight: bold;
        }
        .boxes::after{
            content: "GOOD BY BYE.";
            color: goldenrod;
            font-weight: bold;
        }

        .box::first-letter{
            font-size: 40px;
            color: hotpink;
        }
        .box::selection{
            background-color: black;
            color: white;
        }
        input::placeholder{
            color: green;
            text-transform: uppercase;
        }
        input:focus{
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div class="boxes">
        <div class="box">He was a letter.</div>
        <div class="box">This is a ball.</div>
        <div class="box">What is your name.</div>
        <div class="box">Did not a few days.</div>
        <input type="text" placeholder="your name">
    </div>
</body>
</html>
